# Required repository secrets:
# - APPLE_CERTIFICATE_BASE64: Base64-encoded .p12 Developer ID Application certificate
# - APPLE_CERTIFICATE_PASSWORD: Password for the .p12 file
# - APPLE_ID: Apple ID email for notarytool
# - APPLE_ID_PASSWORD: App-specific password for notarytool
# - APPLE_TEAM_ID: Apple Team ID (VP24Z9CS22)
# - SPARKLE_ED_PRIVATE_KEY: Sparkle EdDSA (ed25519) private key — the single-line
#     base64 string exported with `generate_keys -x key.txt` from the machine
#     whose PUBLIC key is embedded in Info.plist (SUPublicEDKey). CI signs the
#     appcast with this; ed25519 is deterministic, so the CI signature is
#     byte-identical to a local `make dmg`. Required for release dry-runs and tags.
# - LICENSE_PUBLIC_KEY_BASE64URL: Ed25519 license PUBLIC key (base64url, raw
#     32-byte) compiled into the build by `make inject-license-key` (Packet B,
#     PRJCT-2754). Generate a keypair with `swift run license-cli keygen`; the
#     operator holds the matching PRIVATE key in custody (mints customer tokens
#     with `license-cli mint`, never committed). WITHOUT this secret the build
#     is FAIL-CLOSED — no pasted license token activates (trial gate only).
# - BRIDGE_OAUTH_ISSUER / BRIDGE_PUBLIC_RESOURCE / WORKOS_CLIENT_ID /
#     WORKOS_BASE_URL / WORKOS_REDIRECT_URI: public WorkOS/OAuth identity baked
#     into RemoteAccessIdentity.swift for the cloud connector.
#
# Branch-protection note: main requires a pull request and forbids a direct
# push. The appcast step opens a PR from release/appcast-<tag> with the
# CI-signed appcast.xml. It does not check out or push main.

name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for DMG URLs / dry-run (e.g. v3.7.2)"
        required: false
      dry_run:
        description: "Build + sign + notarize + verify appcast, but DO NOT publish the release or commit the appcast"
        type: boolean
        default: false
        required: false
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Install ripgrep (code_search dependency — CodeEditModule tests require `rg` on PATH)
        run: brew install ripgrep

      - name: Run test suite
        run: make test

  build-sign-notarize-dmg:
    runs-on: macos-26
    needs: test
    permissions:
      contents: write
      pull-requests: write
    env:
      SIGNING_IDENTITY: "Developer ID Application: Isaiah Peters (VP24Z9CS22)"
      NOTARIZE_PROFILE: notarytool-profile
      # Packet B (PRJCT-2754): compiled into the build via `make inject-license-key`
      # (make dmg → make build → inject-license-key). Empty/unset → fail-closed.
      LICENSE_PUBLIC_KEY_BASE64URL: ${{ secrets.LICENSE_PUBLIC_KEY_BASE64URL }}
      # Packet E (PRJCT-2754): operator WorkOS/OAuth IdP identity (all NON-SECRET —
      # public issuer/clientID/redirect/resource), baked via `make inject-remote-access`
      # so the cloud connector's OAuth identity is present at every launch with no
      # launchctl-setenv dependency. Empty/unset → fail-closed placeholder (.misconfigured).
      BRIDGE_OAUTH_ISSUER: ${{ secrets.BRIDGE_OAUTH_ISSUER }}
      BRIDGE_PUBLIC_RESOURCE: ${{ secrets.BRIDGE_PUBLIC_RESOURCE }}
      WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
      WORKOS_BASE_URL: ${{ secrets.WORKOS_BASE_URL }}
      WORKOS_REDIRECT_URI: ${{ secrets.WORKOS_REDIRECT_URI }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Capture release metadata
        run: |
          echo "VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)" >> "$GITHUB_ENV"
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Verify required release secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          LICENSE_PUBLIC_KEY_BASE64URL: ${{ secrets.LICENSE_PUBLIC_KEY_BASE64URL }}
          BRIDGE_OAUTH_ISSUER: ${{ secrets.BRIDGE_OAUTH_ISSUER }}
          BRIDGE_PUBLIC_RESOURCE: ${{ secrets.BRIDGE_PUBLIC_RESOURCE }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          WORKOS_BASE_URL: ${{ secrets.WORKOS_BASE_URL }}
          WORKOS_REDIRECT_URI: ${{ secrets.WORKOS_REDIRECT_URI }}
        run: |
          missing=0
          require_secret() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} repository secret is not set"
              missing=1
            fi
          }

          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_ID_PASSWORD \
            APPLE_TEAM_ID \
            SPARKLE_ED_PRIVATE_KEY \
            LICENSE_PUBLIC_KEY_BASE64URL \
            BRIDGE_OAUTH_ISSUER \
            BRIDGE_PUBLIC_RESOURCE \
            WORKOS_CLIENT_ID \
            WORKOS_BASE_URL \
            WORKOS_REDIRECT_URI; do
            require_secret "$name"
          done

          if [ "$missing" -ne 0 ]; then
            echo "Release preflight failed: provision missing repository secrets before running release dry-run or tag release."
            exit 1
          fi

          echo "✅ Required release secrets are configured"

      - name: Install DMG tooling
        run: brew install create-dmg

      - name: Install DMG-background deps (Pillow)
        # scripts/generate_dmg_background.py (make dmg → dmg-background) imports
        # PIL/Pillow to render the DMG window background. Not on the runner image
        # by default; try a plain install first, fall back to --break-system-
        # packages for PEP-668 externally-managed (Homebrew) Pythons.
        run: |
          python3 -m pip install --upgrade Pillow \
            || python3 -m pip install --break-system-packages --upgrade Pillow

      - name: Import Apple certificate into temporary keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/notionbridge-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/notionbridge-developer-id.p12"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcrun \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CERT_PATH=$CERT_PATH" >> "$GITHUB_ENV"

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "$NOTARIZE_PROFILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      - name: Prepare Sparkle signing key
        id: sparkle_key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          ED_KEY_FILE="$RUNNER_TEMP/sparkle_ed_private_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$ED_KEY_FILE"
          chmod 600 "$ED_KEY_FILE"
          echo "ED_KEY_FILE=$ED_KEY_FILE" >> "$GITHUB_ENV"
          echo "has_key=true" >> "$GITHUB_OUTPUT"

      - name: Build notarized DMG (+ signed appcast when key present)
        run: |
          if [ "${{ steps.sparkle_key.outputs.has_key }}" = "true" ]; then
            make dmg \
              SIGNING_ID="$SIGNING_IDENTITY" \
              NOTARIZE_PROFILE="$NOTARIZE_PROFILE" \
              RELEASE_TAG="$RELEASE_TAG" \
              GENERATE_APPCAST=1 \
              SPARKLE_ED_KEY_FILE="$ED_KEY_FILE"
          else
            make dmg \
              SIGNING_ID="$SIGNING_IDENTITY" \
              NOTARIZE_PROFILE="$NOTARIZE_PROFILE" \
              RELEASE_TAG="$RELEASE_TAG" \
              GENERATE_APPCAST=0
          fi

      - name: Verify appcast matches the built DMG
        if: ${{ steps.sparkle_key.outputs.has_key == 'true' }}
        run: |
          DMG=".build/the-bridge-v${VERSION}.dmg"
          test -f "$DMG" || { echo "::error::DMG not found at $DMG"; exit 1; }
          # 1) enclosure URL points at THIS tag's DMG
          EXPECTED_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/the-bridge-v${VERSION}.dmg"
          grep -qF "$EXPECTED_URL" appcast.xml || { echo "::error::appcast enclosure URL does not contain $EXPECTED_URL"; exit 1; }
          # 2) length matches the DMG on disk
          ACTUAL_LEN=$(stat -f%z "$DMG")
          APPCAST_LEN=$(grep -o 'length="[0-9]*"' appcast.xml | tail -1 | grep -o '[0-9]*')
          [ "$ACTUAL_LEN" = "$APPCAST_LEN" ] || { echo "::error::appcast length $APPCAST_LEN != DMG $ACTUAL_LEN"; exit 1; }
          # 3) edSignature equals a fresh signature of the DMG (ed25519 is deterministic)
          SIGN=".build/artifacts/sparkle/Sparkle/bin/sign_update"
          EXPECTED_SIG=$("$SIGN" -p --ed-key-file "$ED_KEY_FILE" "$DMG")
          ACTUAL_SIG=$(grep -o 'sparkle:edSignature="[^"]*"' appcast.xml | tail -1 | sed -E 's/^sparkle:edSignature="//; s/"$//')
          { [ -n "$EXPECTED_SIG" ] && [ "$EXPECTED_SIG" = "$ACTUAL_SIG" ]; } || { echo "::error::appcast edSignature does not match the built DMG"; exit 1; }
          echo "✅ appcast verified — URL + length ($ACTUAL_LEN) + edSignature all match the-bridge-v${VERSION}.dmg"

      - name: Upload build artifacts (DMG + appcast)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: the-bridge-v${{ env.VERSION }}
          path: |
            .build/the-bridge-v${{ env.VERSION }}.dmg
            appcast.xml
          if-no-files-found: warn

      - name: Publish GitHub release asset
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: .build/the-bridge-v${{ env.VERSION }}.dmg

      - name: Open appcast pull request
        if: ${{ steps.sparkle_key.outputs.has_key == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp appcast.xml "$RUNNER_TEMP/appcast.xml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          branch="release/appcast-${RELEASE_TAG}"
          git switch -c "$branch" origin/main
          cp "$RUNNER_TEMP/appcast.xml" appcast.xml
          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml already matches origin/main — no pull request"
            exit 0
          fi
          git add appcast.xml
          git commit -m "release(${RELEASE_TAG}): publish Sparkle appcast for ${RELEASE_TAG}"
          git push -u origin "$branch"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Appcast pull request already open: #${existing}"
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "release(${RELEASE_TAG}): publish Sparkle appcast" \
            --body "CI-signed appcast.xml for ${RELEASE_TAG}. The enclosure signature was produced in this tag run. Do not regenerate it by hand."
          echo "Opened appcast pull request for ${RELEASE_TAG}"

      - name: Cleanup temporary keychain + signing key
        if: ${{ always() }}
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "${CERT_PATH:-}" ]; then
            rm -f "$CERT_PATH"
          fi
          if [ -n "${ED_KEY_FILE:-}" ]; then
            rm -f "$ED_KEY_FILE"
          fi
